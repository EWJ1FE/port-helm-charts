name: Release Charts to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

permissions:
  contents: read
  packages: write

jobs:
  release-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Configure Helm Repositories (Dependencies)
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push to GHCR
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          find . -type f -name "Chart.yaml" -not -path '*/\.*' | while read chart_yaml; do
            chart_dir=$(dirname "$chart_yaml")
            echo "==== Processing $chart_dir ===="

            helm dependency update "$chart_dir"

            pkg_file=$(helm package "$chart_dir" | awk '{print $NF}')
            echo "Packaged to: $pkg_file"

            if [ -f "$pkg_file" ]; then
              helm push "$pkg_file" oci://ghcr.io/$REPO_OWNER/charts
              echo "Successfully pushed $pkg_file to GHCR!"
            else
              echo "Error: Package file not found!"
              exit 1
            fi
          done
